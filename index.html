<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 viewport-fit=cover">

    <title>Invitation — Enveloppe</title>

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

    <!-- CSS de ce prototype uniquement -->
    <link rel="stylesheet" href="envelope.css">

</head>


<body>

    <main id="scene" class="scene">

        <!-- Lumière générale -->
        <div class="ambient-glow"></div>


        <!-- ================= ENVELOPPE ================= -->

        <section id="envelope" class="envelope">
            <!--
                Partie fixe de l'enveloppe.

                Ton image doit être :
                images/envelope-bg.png
            -->
            <img
              src="images/flower-left.png"
              class="envelope-decoration decoration-left"
              alt=""
                    >

            <img
              src="images/flower-right.png"
              class="envelope-decoration decoration-right"
              alt=""
                    >

            <div
                id="envelopeBack"
                class="envelope-back">
            </div>


            <!-- ================= INTÉRIEUR ================= -->

            <div
                id="envelopeInside"
                class="envelope-inside">

                <div class="inside-light"></div>

            </div>


            <!-- ================= RABAT ================= -->

            <div
                id="flap"
                class="flap">


                <!-- FACE AVANT -->

                <div class="flap-front">

                    <div class="paper-sheen"></div>

                    <div
                        class="flap-edge-shadow flap-edge-left">
                    </div>

                    <div
                        class="flap-edge-shadow flap-edge-right">
                    </div>

                </div>


                <!-- FACE ARRIÈRE -->

                <div class="flap-back">

                    <div class="back-light"></div>

                </div>

            </div>


            <!-- Ombre dynamique -->

            <div
                id="movingShadow"
                class="moving-shadow">
            </div>


            <!-- ================= SCEAU ================= -->

            <button
                id="seal"
                class="seal"
                type="button"
                aria-label="Ouvrir l'invitation">

                <img
                    src="images/N.png"
                    alt="Sceau N">

            </button>


        </section>


        <!-- Petit texte -->

        <p
            id="hint"
            class="hint">

            Touchez le sceau pour ouvrir

        </p>


    </main>


    <!-- JavaScript -->
    <script src="envelope.js"></script>

</body>

</html>
